{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#1a3a5c"/>
    <title>ADL Collector</title>
    <link rel="manifest" href="{% static 'adl_collector_app_plugin/manifest.json' %}"/>
</head>
<body>
<div id="collector-field-app"
     data-api-base="/plugins/api/adl-collector"
     data-token-url="/api/token/"></div>

<script type="module" crossorigin src="{% static 'adl_collector_app_plugin/vue/collector-field-app.js' %}"></script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('{% url "plugins:collector_field_sw" %}', {scope: '{% url "plugins:collector_field_pwa" %}'})
            .then(reg => console.log('SW registered, scope:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
    }
</script>
</body>
</html>
